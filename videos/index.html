<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CESAR AI Walkthrough Videos</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        background: #0b1020;
        color: #e6edf7;
        font-family: "IBM Plex Mono", "Courier New", monospace;
      }
      .wrap {
        max-width: 1200px;
        margin: 0 auto;
        padding: 24px;
      }
      h1 {
        margin: 0 0 16px 0;
        font-size: 22px;
        letter-spacing: 0.04em;
      }
      .card {
        border: 1px solid #2a3a56;
        border-radius: 10px;
        background: #11192b;
        padding: 14px;
        margin-bottom: 16px;
      }
      .label {
        font-size: 12px;
        color: #b9c6dc;
        margin-bottom: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      video {
        width: 100%;
        border-radius: 8px;
        border: 1px solid #3a5275;
        background: #0b1020;
      }
      a {
        color: #8fc2ff;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <h1>CESAR AI Walkthrough Videos</h1>

      <section class="card">
        <div class="label">Incident Simulations</div>
        <video controls preload="metadata">
          <source src="./incident-simulations.webm" type="video/webm" />
        </video>
      </section>

      <section class="card">
        <div class="label">Runbook + Interactive Tabs</div>
        <video controls preload="metadata">
          <source src="./runbook-and-tabs.webm" type="video/webm" />
        </video>
      </section>

      <p><a href="../">Back to cesarAIshepherd</a></p>
    </main>
  </body>
</html>
